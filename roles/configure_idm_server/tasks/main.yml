---
- name: Detect active IPv4 interface
  ansible.builtin.set_fact:
    idm_interface: "{{ ansible_default_ipv4.interface }}"

- name: Detect active IPv4 address
  ansible.builtin.set_fact:
    idm_ip: "{{ ansible_default_ipv4.address }}"

- name: Check if FreeIPA is already installed
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: ipa_default_conf

- name: Generate Directory Manager password
  ansible.builtin.set_fact:
    dm_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters','digits']) }}"
  when:
    - dm_password is not defined
    - not ipa_default_conf.stat.exists

- name: Generate FreeIPA admin password
  ansible.builtin.set_fact:
    ipa_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters','digits']) }}"
  when:
    - ipa_admin_password is not defined
    - not ipa_default_conf.stat.exists

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ idm_hostname }}"

- name: Ensure IdM hostname exists in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ idm_ip | regex_escape }}\\s+"
    line: "{{ idm_ip }}  {{ idm_hostname }}  {{ idm_shortname }}"
    state: present
    backup: true

- name: Ensure subscription-manager is installed
  ansible.builtin.dnf:
    name: subscription-manager
    state: present
  failed_when: false

- name: Check current Red Hat subscription status
  ansible.builtin.command: subscription-manager status
  register: rhsm_status
  changed_when: false
  failed_when: false

- name: Determine whether system is currently registered
  ansible.builtin.set_fact:
    rhsm_registered: >-
      {{
        rhsm_status.rc == 0
        and (
          'Overall Status: Current' in rhsm_status.stdout
          or 'Overall Status: Disabled' in rhsm_status.stdout
          or 'System Purpose Status: Matched' in rhsm_status.stdout
        )
      }}

- name: Register host to Red Hat Satellite/CDN when not registered
  when:
    - not rhsm_registered | bool
    - rhsm_register_enabled | bool
  block:
    - name: Fail if RHSM username was not provided
      ansible.builtin.fail:
        msg: "rhsm_username is required when Red Hat registration is needed."
      when: rhsm_username | default('', true) | length == 0

    - name: Fail if RHSM password was not provided
      ansible.builtin.fail:
        msg: "rhsm_password is required when Red Hat registration is needed."
      when: rhsm_password | default('', true) | length == 0

    - name: Clean existing subscription state
      ansible.builtin.command: subscription-manager clean
      changed_when: true
      failed_when: false

    - name: Register system using username and password
      ansible.builtin.command:
        argv:
          - subscription-manager
          - register
          - "--username={{ rhsm_username }}"
          - "--password={{ rhsm_password }}"
          - "--auto-attach"
          - "--force"
      register: rhsm_register_result
      changed_when: true
      no_log: true

    - name: Refresh subscription-manager data
      ansible.builtin.command: subscription-manager refresh
      changed_when: true
      failed_when: false

    - name: Clean DNF metadata after registration
      ansible.builtin.command: dnf clean all
      changed_when: true

    - name: Rebuild DNF cache after registration
      ansible.builtin.command: dnf makecache
      changed_when: true

- name: Check enabled DNF repositories
  ansible.builtin.command: dnf repolist --enabled
  register: enabled_repos
  changed_when: false
  failed_when: false

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - firewalld
      - chrony
      - NetworkManager
      - ipa-server
      - ipa-server-dns
    state: present

- name: Enable and start NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Open FreeIPA firewall services permanently
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - freeipa-4
    - dns
    - ntp

- name: Open FreeIPA TCP firewall ports permanently
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ freeipa_tcp_ports }}"

- name: Open FreeIPA UDP firewall ports permanently
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ freeipa_udp_ports }}"

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false

- name: Replace chrony configuration
  ansible.builtin.copy:
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      # Managed by Ansible

      {% for pool in chrony_pools %}
      pool {{ pool }} iburst
      {% endfor %}

      # DO NOT use DHCP-provided NTP servers for IdM
      # sourcedir /run/chrony-dhcp

      driftfile /var/lib/chrony/drift
      makestep 1.0 3
      rtcsync

      allow {{ internal_ntp_allow_network }}
      local stratum 10

      keyfile /etc/chrony.keys
      ntsdumpdir /var/lib/chrony
      leapsectz right/UTC
      logdir /var/log/chrony
  notify: Restart chronyd

- name: Enable and start chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started

- name: Detect active NetworkManager connection for default interface
  ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show --active
  register: nmcli_active_connections
  changed_when: false

- name: Set NetworkManager connection name
  ansible.builtin.set_fact:
    idm_nm_connection: >-
      {{
        nmcli_active_connections.stdout_lines
        | select('search', ':' ~ idm_interface ~ '$')
        | first
        | split(':')
        | first
      }}

- name: Fail if NetworkManager connection could not be detected
  ansible.builtin.fail:
    msg: "Could not detect active NetworkManager connection for interface {{ idm_interface }}"
  when: idm_nm_connection is not defined or idm_nm_connection | length == 0

- name: Configure DNS server on active NetworkManager connection
  community.general.nmcli:
    conn_name: "{{ idm_nm_connection }}"
    type: ethernet
    dns4:
      - "{{ idm_dns_forwarder }}"
    dns4_ignore_auto: true
    state: present

- name: Bring NetworkManager connection up
  ansible.builtin.command: "nmcli connection up '{{ idm_nm_connection }}'"
  changed_when: true

- name: Install FreeIPA server with integrated DNS
  ansible.builtin.command: >
    ipa-server-install
    --unattended
    --realm {{ idm_realm }}
    --domain {{ idm_domain }}
    --hostname {{ idm_hostname }}
    --ds-password {{ dm_password | quote }}
    --admin-password {{ ipa_admin_password | quote }}
    --setup-dns
    --forwarder {{ idm_dns_forwarder }}
    --no-ntp
  register: ipa_install_result
  no_log: false
  when: not ipa_default_conf.stat.exists

- name: Show FreeIPA installation summary
  ansible.builtin.debug:
    msg:
      - "FreeIPA installation status: {{ 'already installed' if ipa_default_conf.stat.exists else 'installed by this run' }}"
      - "Hostname: {{ idm_hostname }}"
      - "Short name: {{ idm_shortname }}"
      - "Domain: {{ idm_domain }}"
      - "Realm: {{ idm_realm }}"
      - "Server IP: {{ idm_ip }}"
      - "Detected interface: {{ idm_interface }}"
      - "NetworkManager connection: {{ idm_nm_connection }}"
      - "DNS forwarder: {{ idm_dns_forwarder }}"
      - "Red Hat registered before this run: {{ rhsm_registered }}"
      - "Red Hat registration enabled: {{ rhsm_register_enabled }}"
      - "Directory Manager password: {{ dm_password | default('not generated; FreeIPA was already installed') }}"
      - "FreeIPA admin username: admin"
      - "FreeIPA admin password: {{ ipa_admin_password | default('not generated; FreeIPA was already installed') }}"
      - "Web UI: https://{{ idm_hostname }}"