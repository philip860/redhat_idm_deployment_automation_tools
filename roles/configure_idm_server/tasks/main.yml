    - name: Detect active IPv4 interface
      ansible.builtin.set_fact:
        idm_interface: "{{ ansible_default_ipv4.interface }}"

    - name: Generate Directory Manager password
      ansible.builtin.set_fact:
        dm_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters','digits','punctuation']) }}"

    - name: Generate FreeIPA admin password
      ansible.builtin.set_fact:
        ipa_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters','digits','punctuation']) }}"

    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ idm_hostname }}"

    - name: Ensure IdM hostname exists in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ idm_ip | regex_escape }}\\s+"
        line: "{{ idm_ip }}  {{ idm_hostname }}  {{ idm_shortname }}"
        state: present
        backup: true

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - firewalld
          - chrony
          - NetworkManager
          - ipa-server
          - ipa-server-dns
        state: present

    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Open FreeIPA firewall services permanently
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - freeipa-4
        - dns
        - ntp

    - name: Open FreeIPA TCP firewall ports permanently
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ freeipa_tcp_ports }}"

    - name: Open FreeIPA UDP firewall ports permanently
      ansible.posix.firewalld:
        port: "{{ item }}/udp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ freeipa_udp_ports }}"

    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false

    - name: Replace chrony configuration
      ansible.builtin.copy:
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          # Managed by Ansible

          # Use trusted external time sources
          {% for pool in chrony_pools %}
          pool {{ pool }} iburst
          {% endfor %}

          # DO NOT use DHCP-provided NTP servers for IdM
          # sourcedir /run/chrony-dhcp

          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync

          allow {{ internal_ntp_allow_network }}
          local stratum 10

          keyfile /etc/chrony.keys
          ntsdumpdir /var/lib/chrony
          leapsectz right/UTC
          logdir /var/log/chrony
      notify: Restart chronyd

    - name: Enable chronyd
      ansible.builtin.systemd:
        name: chronyd
        enabled: true
        state: started

    - name: Configure DNS server on active NetworkManager connection
      community.general.nmcli:
        conn_name: "{{ idm_interface }}"
        type: ethernet
        dns4:
          - "{{ idm_dns_forwarder }}"
        dns4_ignore_auto: true
        state: present

    - name: Bring NetworkManager connection up
      ansible.builtin.command: "nmcli connection up {{ idm_interface }}"
      changed_when: true

    - name: Check if FreeIPA is already installed
      ansible.builtin.stat:
        path: /etc/ipa/default.conf
      register: ipa_default_conf

    - name: Install FreeIPA server with integrated DNS
      ansible.builtin.command: >
        ipa-server-install
        --unattended
        --realm {{ idm_realm }}
        --domain {{ idm_domain }}
        --hostname {{ idm_hostname }}
        --ds-password {{ dm_password | quote }}
        --admin-password {{ ipa_admin_password | quote }}
        --setup-dns
        --forwarder {{ idm_dns_forwarder }}
        --no-ntp
      register: ipa_install_result
      no_log: true
      when: not ipa_default_conf.stat.exists

    - name: Show FreeIPA installation summary
      ansible.builtin.debug:
        msg:
          - "FreeIPA installation complete."
          - "Hostname: {{ idm_hostname }}"
          - "Short name: {{ idm_shortname }}"
          - "Domain: {{ idm_domain }}"
          - "Realm: {{ idm_realm }}"
          - "Server IP: {{ idm_ip }}"
          - "Detected interface: {{ idm_interface }}"
          - "DNS forwarder: {{ idm_dns_forwarder }}"
          - "Directory Manager password: {{ dm_password }}"
          - "FreeIPA admin username: admin"
          - "FreeIPA admin password: {{ ipa_admin_password }}"
          - "Web UI: https://{{ idm_hostname }}"

